<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Transição · All Limits</title>
<meta name="description" content="Treino de triatlo do grupo para a All Limits: plano, coach, Strava e competição.">
<meta name="theme-color" content="#14203D">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Transição">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="logo-mark" style="width:34px;height:34px" aria-hidden="true"></span>Transição</div>
  <button type="button" class="menubtn" id="menubtn" aria-label="Abrir menu" aria-expanded="false" aria-controls="tabs" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button role="tab" data-v="painel" aria-selected="true"><span>01</span>Painel</button>
    <button role="tab" data-v="treinos"><span>02</span>Treinos</button>
    <button role="tab" data-v="dieta"><span>03</span>Alimentação</button>
    <button role="tab" data-v="coach"><span>04</span>Coach</button>
    <button role="tab" data-v="equipe"><span>05</span>Grupo</button>
    <button role="tab" data-v="dados" class="me" aria-label="Configurações"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Configurações</button>
  </nav>
  <div class="syncbox"><button id="logout" class="btn ghost sm" hidden>Sair</button><span id="savestate" class="savestate" data-st="idle" aria-live="polite"></span><button hidden class="btn ghost sm reloadbtn" data-act="reload" title="Recarregar tudo o que está salvo e os treinos do Strava" aria-label="Recarregar tudo"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Recarregar</button></div>
</div></header>


<section id="auth" class="wrap authscreen" hidden>
  <div class="authcard panel">
    <span class="logo-mark lg" style="width:110px;height:110px" aria-hidden="true"></span>
    <div class="eyebrow">All Limits · High Limits · 30/05/2027</div>
    <h1>Transição</h1>
    <p class="muted" style="margin:0">Treino de triatlo do grupo. Entre com seu usuário ou crie sua conta.</p>
    <div class="authseg" role="group" aria-label="Entrar ou criar conta"><button type="button" data-authmode="login" aria-pressed="true">Já tenho conta</button><button type="button" data-authmode="signup" aria-pressed="false">Criar conta</button></div>
    <form id="authform" class="stack" data-mode="login">
      <div class="fld"><label for="auth_user">Usuário</label><input id="auth_user" autocomplete="username" autocapitalize="none" spellcheck="false" required pattern="[A-Za-z0-9._]{3,20}" placeholder="ex: henrique"></div>
      <div class="fld"><label for="auth_pass">Senha</label><input id="auth_pass" type="password" required minlength="4" autocomplete="current-password" placeholder="mínimo 4, ex: 1234"></div>
      <div id="auth_signup_extra" class="stack" hidden>
        <div class="fld"><label for="auth_pass2">Repita a senha</label><input id="auth_pass2" type="password" minlength="4" autocomplete="new-password"></div>
        <div class="fld" hidden><label for="auth_code">Código do grupo</label><input id="auth_code" autocomplete="off" placeholder="peça ao organizador"></div>
      </div>
      <div id="auth_err" class="status err" hidden></div>
      <button id="auth_submit" class="btn" type="submit">Entrar</button>
    </form>
  </div>
</section>
<main class="wrap" id="app" hidden>
  <div class="hero"><div><div class="eyebrow">Carregando</div><h1>Preparando seu painel</h1><p>Natação, bike e corrida num lugar só. Conectando aos seus dados…</p></div></div>
</main>


<nav class="bottomnav" id="bottomnav" aria-label="Navegação" hidden>
  <button type="button" data-v="painel"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Painel</span></button>
  <button type="button" data-v="treinos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Treinos</span></button>
  <button type="button" data-v="dieta"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 3c-2 2-3 5-3 8h3v10"/></svg><span>Comida</span></button>
  <button type="button" data-v="coach"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Coach</span></button>
  <button type="button" data-v="equipe"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg><span>Grupo</span></button>
</nav>
<footer class="appfoot wrap"><span id="appversion"></span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shim.js"></script>
<script src="/app.js"></script>
</body>
</html>

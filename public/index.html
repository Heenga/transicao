<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Transição · All Limits</title>
<meta name="description" content="Treino de triatlo do grupo para a All Limits: plano, coach, Strava e competição.">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Transição">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>body{margin:0;font:15px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body data-view="loading">
<header class="top"><div class="top-in">
  <a class="brand" href="/" id="brand" aria-label="Transição: voltar para Hoje"><span class="logo-mark" style="width:28px;height:28px" aria-hidden="true"></span><span>Transição</span></a>
  <div class="topacts" id="topacts" hidden>
    <span id="savestate" class="savestate" data-st="idle" aria-live="polite"></span>
    <button type="button" class="iconbtn reloadbtn" data-act="reload" title="Recarregar tudo e buscar treinos novos do Strava" aria-label="Recarregar tudo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-14.8 5.7M3.5 12A8.5 8.5 0 0 1 18.3 6.3"/><path d="M18.5 2.5v4h-4M5.5 21.5v-4h4"/></svg></button>
    <button type="button" class="avatar" id="avatar" aria-label="Configurações e perfil">?</button>
    <button id="logout" hidden>Sair</button>
  </div>
</div></header>

<section id="auth" class="authscreen" hidden>
  <div class="authcard">
    <span class="logo-mark" style="width:84px;height:84px" aria-hidden="true"></span>
    <div class="eyebrow">All Limits · High Limits · 30/05/2027</div>
    <h1>Transição</h1>
    <p class="muted">Treino de triatlo do grupo. Entre com seu usuário ou crie sua conta.</p>
    <div class="authseg" role="group" aria-label="Entrar ou criar conta"><button type="button" data-authmode="login" aria-pressed="true">Já tenho conta</button><button type="button" data-authmode="signup" aria-pressed="false">Criar conta</button></div>
    <form id="authform" class="stack" data-mode="login">
      <div class="fld"><label for="auth_user">Usuário</label><input id="auth_user" autocomplete="username" autocapitalize="none" spellcheck="false" required pattern="[A-Za-z0-9._]{3,20}" placeholder="ex: henrique"></div>
      <div class="fld"><label for="auth_pass">Senha</label><input id="auth_pass" type="password" required minlength="4" autocomplete="current-password" placeholder="mínimo 4, ex: 1234"></div>
      <div id="auth_signup_extra" class="stack" hidden>
        <div class="fld"><label for="auth_pass2">Repita a senha</label><input id="auth_pass2" type="password" minlength="4" autocomplete="new-password"></div>
        <div class="fld" hidden><label for="auth_code">Código do grupo</label><input id="auth_code" autocomplete="off" placeholder="peça ao organizador"></div>
      </div>
      <div id="auth_err" class="status err" hidden></div>
      <button id="auth_submit" class="btn block" type="submit">Entrar</button>
    </form>
  </div>
</section>

<main id="app" hidden>
  <div class="skel" aria-label="Carregando">
    <div class="sk sk-t"></div><div class="sk sk-h"></div><div class="sk sk-hero"></div>
    <div class="sk-row"><div class="sk sk-q"></div><div class="sk sk-q"></div><div class="sk sk-q"></div><div class="sk sk-q"></div></div>
    <div class="sk sk-card"></div>
  </div>
</main>

<nav class="bottomnav" id="bottomnav" aria-label="Navegação" hidden>
  <button type="button" data-v="painel"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span>Hoje</span></button>
  <button type="button" data-v="treinos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Treinos</span></button>
  <button type="button" data-v="coach" class="nav-coach"><span class="nc-ring"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.3 7.6L3.5 21l1.3-4.4A8.5 8.5 0 1 1 20.5 12z"/></svg></span><span>Coach</span></button>
  <button type="button" data-v="dieta"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10"/><path d="M17.5 3c-2.2 2-3.2 5-3.2 8h3.2v10"/></svg><span>Comida</span></button>
  <button type="button" data-v="equipe"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5.5 6.5-5.5s5.5 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg><span>Grupo</span></button>
</nav>
<div id="toasts" class="toasts" aria-live="polite"></div>
<footer class="appfoot" hidden><span id="appversion"></span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shim.js"></script>
<script src="/motor.js"></script>
<script src="/pontos.js"></script>
<script src="/analise.js"></script>
<script src="/app.js"></script>
</body>
</html>
